<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>First Win Coach</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one story at a time, read top to bottom like a case file. Real documents carry the page; chrome stays quiet. */
:root{
  --paper:#F3F5F8; --surface:#FFFFFF; --ink:#141C28; --muted:#566173; --line:#DCE1E9;
  --accent:#2E47CF; --accent-ink:#FFFFFF; --accent-soft:#E7ECFF;
  --hi:#FFE45A; --hi-ink:#1C1800; --good:#1D7A4C; --good-soft:#E3F4EB; --warn:#A0450B; --warn-soft:#FDEBDD;
  --note:#FFF6C9; --note-ink:#3B3300; --bubble:#E9EDF3;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#9BA6B6; --line:#283344;
  --accent:#8FA2FF; --accent-ink:#0E131A; --accent-soft:#1C2550;
  --hi:#F2D73A; --hi-ink:#1C1800; --good:#5FD39A; --good-soft:#12301F; --warn:#F5A066; --warn-soft:#3A2010;
  --note:#3A3410; --note-ink:#F6EBB0; --bubble:#222B38; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0E131A; --surface:#161D27; --ink:#E6EBF2; --muted:#9BA6B6; --line:#283344;
  --accent:#8FA2FF; --accent-ink:#0E131A; --accent-soft:#1C2550;
  --hi:#F2D73A; --hi-ink:#1C1800; --good:#5FD39A; --good-soft:#12301F; --warn:#F5A066; --warn-soft:#3A2010;
  --note:#3A3410; --note-ink:#F6EBB0; --bubble:#222B38; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font:500 .72rem/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.05rem}
.demo{font:500 .72rem/1 var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700}

/* Home */
.intro h1{font-size:clamp(1.9rem,4.6vw,2.9rem);letter-spacing:-.02em;max-width:18ch}
.intro p{color:var(--muted);font-size:1.08rem;max-width:60ch;margin-top:12px}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.person{display:grid;grid-template-columns:150px minmax(0,1fr);text-align:left;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:border-color .15s,transform .15s}
.person:hover{border-color:var(--accent);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.person,.person:hover{transition:none;transform:none}}
.person img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block;min-height:210px}
.person .txt{padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.person h2{font-size:1.25rem}
.person .sit{font-size:.98rem}
.clock{display:inline-flex;gap:6px;align-items:center;font:500 .75rem/1.2 var(--mono);color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:6px 10px;width:fit-content}
.go{margin-top:auto;font-weight:700;color:var(--accent)}
@media (max-width:460px){.person{grid-template-columns:110px minmax(0,1fr)}.person img{min-height:240px}}

/* Story */
.who{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center}
.who img{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center 20%}
.who h1{font-size:1.5rem}
.ch{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.ch-h{display:flex;gap:12px;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px}
.ch-h .n{font:500 .8rem/1 var(--mono);color:var(--accent)}
.ch-h h2{font-size:1.35rem}
.lede{font-size:1.04rem;max-width:64ch}
.next{align-self:flex-start;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:12px 18px}
.next:hover{filter:brightness(1.08)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}

/* Real-world documents */
.review{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.rv-top{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--accent-soft);color:var(--ink);flex:none}
.stars{color:var(--warn);letter-spacing:2px;font-size:1rem}
.stars .off{color:var(--line)}
.owner{margin-left:22px;border-left:3px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px;white-space:pre-wrap}
.owner b{font-size:.9rem}
.text{background:var(--bubble);border-radius:16px 16px 16px 4px;padding:10px 14px;max-width:34ch}
.textmeta{font-size:.78rem;color:var(--muted);margin-bottom:6px}
.sched{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
.sched th,.sched td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
.sched .out{color:var(--warn);font-weight:700}
.policy{border-left:4px solid var(--ink)}
.policy b{display:block;margin-bottom:4px}
.handnotes{background:var(--note);color:var(--note-ink);border-radius:4px;padding:18px 20px;font-family:var(--hand);font-size:1.45rem;line-height:1.35;white-space:pre-wrap;box-shadow:0 1px 0 var(--line);transform:rotate(-.4deg);overflow-wrap:anywhere}
.email{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.email .eh{padding:10px 16px;border-bottom:1px solid var(--line);font-size:.88rem;display:grid;gap:2px}
.email .eb{padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere}
.thread .msg{padding:10px 16px;border-bottom:1px solid var(--line);font-size:.95rem}
.thread .msg:last-child{border-bottom:0}
.thread .msg b{margin-right:8px}

/* Chat with the AI */
.chat{display:flex;flex-direction:column;gap:12px}
.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;padding:10px 14px;max-width:min(560px,90%);white-space:pre-wrap;overflow-wrap:anywhere}
.att{display:inline-block;margin-top:6px;font:500 .75rem/1.2 var(--mono);background:rgba(255,255,255,.18);border-radius:6px;padding:5px 8px}
.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:14px 16px;max-width:min(640px,96%);white-space:pre-wrap;overflow-wrap:anywhere}
.tag{display:block;font:500 .68rem/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;opacity:.75}
mark{background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark sup{font:700 .66rem/1 var(--mono);margin-left:2px}
.wrong{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.wrong li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start}
.wrong .num{width:22px;height:22px;border-radius:50%;background:var(--hi);color:var(--hi-ink);font:700 .72rem/22px var(--mono);text-align:center}
.wrong q{font-weight:700}
.verdict{border-radius:10px;padding:12px 14px;background:var(--warn-soft);border:1px solid var(--warn)}
.verdict.ok{background:var(--good-soft);border-color:var(--good)}

/* Builder */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent)}
.opt b{display:block}
.opt span{font-size:.88rem;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}
@media (max-width:760px){.panes{grid-template-columns:minmax(0,1fr)}}
.req{font:400 .86rem/1.55 var(--mono);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-wrap:anywhere}
.req .add{background:var(--accent-soft);border-radius:3px}
.meter{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font:500 .75rem/1.2 var(--mono);border-radius:999px;padding:6px 10px;border:1px solid var(--line);background:var(--surface)}
.pill.bad{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pill.good{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.flash{animation:flash .6s ease}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}

/* Checks */
.claims{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.claims li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.claims .ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem}
.claims .ok .ic{background:var(--good-soft);color:var(--good)}
.claims .no .ic{background:var(--warn-soft);color:var(--warn)}
.claims q{font-weight:700}

/* Your turn */
textarea{width:100%;min-height:150px;font:inherit;font-size:1rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;resize:vertical}
textarea::placeholder{color:var(--muted)}
.covered{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.covered li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;font-size:.95rem}
.covered .y{color:var(--good);font-weight:700}
.covered .n{color:var(--warn);font-weight:700}
.take{background:var(--ink);color:var(--paper);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px}
.take h3{font-size:1.15rem}
.take ol{margin:0;padding-left:20px;display:grid;gap:4px}
.end{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:700}
.btn2:hover{border-color:var(--ink)}
</style>

/* ======================= STORY DATA ======================= */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const words=t=>t.split(/\s+/).filter(w=>/[A-Za-z0-9$]/.test(w)).length;

/* ---------- Tom: store manager, customer reviews ---------- */
function tomReply(f, who){ // who = "jordan" | "marcus"
  const J = who==="jordan", P=[], name = J?"Jordan":"Marcus";
  const greet = f.who ? `Hi ${name},` : "Dear Valued Customer,";
  if(!f.who) P.push({q:"Dear Valued Customer", n:`${name} has a name, and a real person should answer.`});
  const apology = f.style
    ? (J?"I'm sorry your Saturday visit went this way.":"I'm sorry we let you down on Sofia's birthday.")
    : "We are so sorry to hear about your experience and sincerely apologize for any inconvenience. Your satisfaction is our top priority.";
  if(!f.style) P.push({q:"Your satisfaction is our top priority", n:"Filler. Reads like a form letter, and it's long."});
  const what = f.facts
    ? (J?"Two of our four cashiers called in sick that morning, which is why the lines were so long, and I should have come out when you asked for a manager."
        :"One of our ovens broke down on Friday afternoon and backed up every order, and we wrote her name down wrong when we took your call.")
    : (J?"We understand that long lines and a product that doesn't meet expectations can be frustrating."
        :"We understand that delays and errors can be frustrating.");
  if(!f.facts) P.push({q:J?"long lines and a product that doesn't meet expectations":"delays and errors can be frustrating", n:"Says nothing about why it happened."+(J?" Ignores the missing manager.":"")});
  const fix = f.fix
    ? (J?"The chicken was cold because our hot-case thermometer was reading low. We replaced it on Sunday."
        :"Our bakery now reads every name back and spells it out on phone orders.")
    : (J?"We have retrained our entire deli team on food safety, and we will have four lanes open every weekend going forward."
        :"We have hired additional bakery staff to make sure this never happens again.");
  if(!f.fix){
    if(J){ P.push({q:"retrained our entire deli team", n:"Never happened. Posted publicly, it's now a promise."}); P.push({q:"four lanes open every weekend", n:"Can Tom really staff four lanes every weekend?"}); }
    else P.push({q:"hired additional bakery staff", n:"Nobody was hired. The AI made it up."});
  }
  const offer = f.limit
    ? (J?"I'd like to make it right with a $10 credit.":"I'd like to make it right with a $10 credit toward your next order.")
    : (J?"Please accept 20% off your next shopping trip as a token of our appreciation.":"Please enjoy a free birthday cake on us next time.");
  if(!f.limit) P.push({q:J?"20% off your next shopping trip":"a free birthday cake on us", n:"Over Tom's $10 limit. That needs district approval."});
  const close = f.who ? "Next time you're in, ask for me.\n— Tom, Store Manager" : "We hope to see you again soon!\nSincerely,\nThe Hillside Market Management Team";
  if(!f.who) P.push({q:"The Hillside Market Management Team", n:J?"Jordan asked for a manager and got a committee.":"Sounds like nobody in particular wrote it."});
  return {text:`${greet}\n\n${[apology,what,fix,offer].join(" ")}\n\n${close}`, problems:P};
}

/* ---------- Maria: office admin, meeting notes ---------- */
function mariaMinutes(f){
  const P=[], L=[];
  if(f.reader) L.push("Sam, here's what we decided at this morning's ops sync and who's doing what.","");
  else { L.push("Meeting Summary – Ops Sync 10/14",""); P.push({q:"Meeting Summary – Ops Sync 10/14",n:"Generic. Doesn't speak to Sam or answer what he asked."}); }
  if(!f.length){ L.push("The team met on 10/14 to discuss several operational topics. Overall it was a productive meeting with good progress on several fronts.",""); P.push({q:"a productive meeting with good progress",n:"Filler. Sam said keep it short."}); }
  const printer = f.noguess ? "Thursday (not confirmed yet)" : "Thursday";
  const parking = f.dates ? "end of month" : "October 31";
  if(f.format){
    L.push("Decisions","- Holiday party budget approved: $1,200.","- iPad visitor sign-in starts Nov 3.");
    if(!f.noguess){ L.push("- The holiday party will be a potluck."); P.push({q:"The holiday party will be a potluck",n:"Not decided. Tom suggested it; nobody agreed. And Priya is booking a venue."}); }
    L.push("","Action items",`- Raj: confirm the printer technician visit, ${printer}`,"- Priya: book the party venue, by 10/31","- Lee: print sign-in instructions for the front desk, before Nov 3",`- Everyone: renew parking permits online, by ${parking}`,"- Everyone: send Q4 supply requests to Maria, by 10/21","- Dana: Q4 supply order due 10/24");
    if(!f.noguess) P.push({q:"technician visit, Thursday",n:"Maria's notes say \"thurs?\". It isn't confirmed."});
    if(f.noguess) L.push("","Still open","- Venue or potluck? Tom suggested a potluck; no decision yet.","- Printer visit: Raj to confirm Thursday.");
  } else {
    L.push(`The 3rd-floor printer is still broken; Raj called the vendor and a technician is coming ${printer}. The $1,200 holiday party budget was approved${f.noguess?", but venue versus potluck is still undecided":" and the team decided on a potluck"}. The new iPad visitor sign-in starts Nov 3. Parking permits expire ${f.dates?"at the end of the month":"on October 31"}, so everyone should renew online. Q4 supply requests are due soon.`);
    P.push({q:"Q4 supply requests are due soon",n:"Sam asked who's doing what. Owners and dates are gone."});
    if(!f.noguess){ P.push({q:"the team decided on a potluck",n:"Not decided. Tom suggested it; nobody agreed."}); P.push({q:"a technician is coming Thursday",n:"Maria's notes say \"thurs?\". It isn't confirmed."}); }
  }
  if(!f.dates) P.push({q:"October 31",n:"Her notes say \"end of month\". The AI picked a date."});
  return {text:L.join("\n"), problems:P};
}
function mariaThread(f){
  const P=[], L=[];
  if(f.reader) L.push("Hi all, quick update on the lobby repaint:","");
  else { L.push("Email Thread Summary: Lobby Repaint",""); P.push({q:"Email Thread Summary: Lobby Repaint",n:"Generic title. Who is this for?"}); }
  if(!f.length){ L.push("This email thread discussed the upcoming lobby repaint project in detail, with several team members contributing their input.",""); P.push({q:"several team members contributing their input",n:"Filler nobody needs on Slack."}); }
  const vote = f.dates ? "Wednesday" : "Wednesday, Oct 21";
  const access = f.noguess ? "Ana offered to let the painters in at 7 a.m. if she gets Monday morning off. Kim hasn't approved that yet." : "Ana will let the painters in at 7 a.m. and take Monday morning off.";
  if(f.format){
    L.push("- Date: Saturday, Nov 14 (Nov 7 is the open house).","- Cost: $2,300.",`- Access: ${access}`,`- To do: vote on a paint color by ${vote}. Two samples are at the front desk.`);
  } else {
    L.push(`The lobby will be repainted on Saturday, Nov 14, for $2,300. ${access} Please vote on a paint color by ${vote}.`);
    P.push({q:"The lobby will be repainted",n:"One paragraph. On Slack, people skim for the date and what they need to do."});
  }
  if(!f.noguess) P.push({q:"take Monday morning off",n:"Kim never approved this. Now the whole office thinks it's settled."});
  if(!f.dates) P.push({q:"Wednesday, Oct 21",n:"The thread just says \"Wed\". The AI added a date."});
  return {text:L.join("\n"), problems:P};
}

    f.noguess ? {ok:true,q:"Venue or potluck? … no decision yet",s:"Matches what Maria remembers."} : {ok:false,q:"potluck",s:"Nobody agreed to it. Priya may already be booking a venue."},
    f.dates ? {ok:true,q:"end of month",s:"Exactly as written in her notes."} : {ok:false,q:"October 31",s:"Not in her notes. Check the permit office's real deadline."},
    f.format ? {ok:true,q:"Everyone: send Q4 supply requests to Maria, by 10/21",s:"Owner and date match her notes."} : {ok:false,q:"due soon",s:"Her notes have exact owners and dates."}
  ],
  postedTitle:"Sent to Sam",
  posted:(r,n)=>`<div class="email"><div class="eh"><span><b>To:</b> Sam (Director)</span><span><b>Subject:</b> Ops sync 10/14: decisions and actions</span><span class="muted">Sent 11:41 a.m.</span></div><div class="eb">${esc(r.text)}</div></div>
     <div class="email"><div class="eh"><span><b>From:</b> Sam (Director)</span><span class="muted">11:58 a.m.</span></div><div class="eb">${esc(n===0?"This is exactly what I needed. Can you send these after every sync?":(r.problems.every(p=>/Filler|Generic/.test(p.n)))?"Thanks Maria, got what I need. Could be shorter next time, I read these on my phone.":n<=2?"Thanks Maria. Quick check: is everything here actually confirmed?":"Wait, did we decide on a potluck? Priya just told me she booked a venue. And who's doing what here?")}</div></div>`,
  turnIntro:"Thursday. A long email thread about repainting the lobby. The whole office needs a short summary on Slack. This time you write Maria's request yourself.",
  turnPrimary:()=>`<div class="email thread"><div class="eh"><span><b>Thread:</b> Re: Lobby repaint (6 messages)</span></div>
     <div class="msg"><b>Kim</b>Painters can do Sat 11/7 or Sat 11/14. Quote is $2,300.</div>
     <div class="msg"><b>Ben</b>I prefer 11/14, the 7th is the open house.</div>
     <div class="msg"><b>Kim</b>Ok 11/14. Need someone to let them in at 7am.</div>
     <div class="msg"><b>Ana</b>I can do 7am if I get Monday morning off.</div>
     <div class="msg"><b>Ben</b>Fine by me. Color still not picked, two samples at front desk.</div>
     <div class="msg"><b>Kim</b>Vote on color by Wed please.</div></div>`,
  turnKnows:()=>`<div class="grid2">
     <div class="box"><p class="label" style="margin-bottom:6px">What Maria knows</p><p class="small">Ben isn't Ana's manager. Kim is, and Kim hasn't answered Ana's request yet.</p></div>
     <div class="box"><p class="label" style="margin-bottom:6px">Where it's going</p><p class="small">The #office Slack channel. 40 people, most of whom only read the first two lines.</p></div>
   </div>`,
  placeholder:"Write your request to the AI, the way Maria would. The thread is attached for you.",
  detect:{
    reader:/office|everyone|team|staff|\ball\b|slack|whole|channel/i,
    format:/bullet|list|section|decid|action|owner|who'?s doing|to.?do|parts/i,
    noguess:/guess|not decided|undecided|\bopen\b|question|unclear|not confirmed|pending|approv/i,
    dates:/as written|exact|don'?t (change|invent|add)|\bdates?\b/i,
    length:/\d+\s*(words|lines)|short|brief|no filler|concise|quick/i
  },
  hints:{reader:"This goes to the whole office on Slack.",format:"Use bullets: date, cost, who does what.",noguess:"Ana's Monday off isn't approved yet. Don't guess.",dates:"Keep dates exactly as written in the thread.",length:"Keep it under 60 words."},
  turnCompose:mariaThread,
  turnAttach:"Lobby repaint thread",
  take:{h:"Next time you ask AI to summarize a meeting or a thread, tell it:",items:["Who reads it, and what they need from it.","The format they already expect.","Not to guess: undecided things stay open.","To keep dates and numbers exactly as written.","How long it should be."]}
};
const STORIES={tom:TOM, maria:MARIA};

/* ======================= RENDER HELPERS ======================= */
function reviewInner(initial,name,when,stars,body){
  return `<div class="rv-top"><span class="av">${initial}</span><div><b>${esc(name)}</b><div class="small muted">${when}</div></div></div>
    <div class="stars" aria-label="${stars} out of 5 stars">${"★".repeat(stars)}<span class="off">${"★".repeat(5-stars)}</span></div><p>${esc(body)}</p>`;
}
const reviewCard=(...a)=>`<div class="review">${reviewInner(...a)}</div>`;
function markup(text, problems){
  const low=text.toLowerCase(), spans=[];
  problems.forEach((p,i)=>{ const a=low.indexOf(p.q.toLowerCase()); if(a>=0 && !spans.some(s=>a<s.e&&a+p.q.length>s.a)) spans.push({a,e:a+p.q.length,i}); });
  spans.sort((x,y)=>x.a-y.a); let out="",pos=0;
  spans.forEach((s,k)=>{ out+=esc(text.slice(pos,s.a))+`<mark>${esc(text.slice(s.a,s.e))}<sup>${k+1}</sup></mark>`; pos=s.e; });
  return {html:out+esc(text.slice(pos)), order:spans.map(s=>problems[s.i])};
}
const wrongList=order=>`<ol class="wrong">${order.map((p,i)=>`<li><span class="num">${i+1}</span><span><q>${esc(p.q)}</q> ${esc(p.n)}</span></li>`).join("")}</ol>`;
const $=s=>document.querySelector(s);
const app=$("#app");

/* ======================= HOME ======================= */
function home(){
  app.innerHTML=`
   <div class="top"><span class="brand">First Win Coach</span><span class="demo">Interactive demo</span></div>
   <section class="intro">
     <h1>One better request changes what AI gives you back.</h1>
     <p>Two real work situations. See the first try go wrong, fix it using facts the person already knows, then write a request yourself. About 4 minutes each.</p>
   </section>
   <div class="people">${[TOM,MARIA].map(s=>`
     <button class="person" data-id="${s.id}">
       <img src="${s.photo}" alt="${esc(s.name)}, ${esc(s.role.toLowerCase())}">
       <div class="txt"><span class="label">${esc(s.role)} · ${esc(s.place)}</span><h2>${esc(s.name)}</h2><p class="sit">${esc(s.card)}</p><span class="clock">⏱ ${esc(s.clock)}</span><span class="go">Help ${esc(s.name)} →</span></div>
     </button>`).join("")}
   </div>`;
  document.querySelectorAll(".person").forEach(b=>b.onclick=()=>story(b.dataset.id));
  window.scrollTo({top:0});
}

/* ======================= STORY ======================= */
let S=null;
function story(id){
  const st=STORIES[id];
  S={st, upto:1, f:Object.fromEntries(st.options.map(o=>[o.k,false]))};
  app.innerHTML=`
   <div class="top"><button class="link" id="back">← Both stories</button><span class="demo">Interactive demo</span></div>
   <div class="who"><img src="${st.photo}" alt=""><div><span class="label">${esc(st.role)} · ${esc(st.place)}</span><h1>${esc(st.name)}</h1></div></div>
   <div id="chs" style="display:flex;flex-direction:column;gap:40px"></div>`;
  $("#back").onclick=home;
  renderUpTo(1);
  window.scrollTo({top:0});
}
const CHAPTERS=[ch1,ch2,ch3,ch4,ch5,ch6];
function renderUpTo(n){
  S.upto=n; const c=$("#chs"); c.innerHTML="";
  for(let i=1;i<=n;i++){ const sec=document.createElement("section"); sec.className="ch"; sec.id="ch"+i; c.append(sec); CHAPTERS[i-1](sec, i===n); }
}
function advance(){ const n=S.upto+1; renderUpTo(n); $("#ch"+n).scrollIntoView({behavior:"smooth",block:"start"}); }
const head=(n,t)=>`<div class="ch-h"><span class="n">${n}</span><h2>${t}</h2></div>`;
const nextBtn=(cur,label)=>cur?`<button class="next">${label}</button>`:"";
function wireNext(sec){ const b=sec.querySelector(".next"); if(b) b.onclick=advance; }

function ch1(sec,cur){ const st=S.st;
  sec.innerHTML=`${head("01","The situation")}
    <span class="clock">⏱ ${esc(st.clock)}</span>
    <p class="lede">${esc(st.intro)}</p>
    <div><p class="label" style="margin-bottom:8px">${esc(st.primaryTitle)}</p>${st.primary()}</div>
    <div><p class="label" style="margin-bottom:8px">${esc(st.knowsTitle)}</p>${st.knows()}</div>
    ${nextBtn(cur,`See ${st.name}'s first try →`)}`;
  wireNext(sec);
}
function ch2(sec,cur){ const st=S.st;
  const r=st.compose(Object.fromEntries(st.options.map(o=>[o.k,false]))), m=markup(r.text,r.problems);
  sec.innerHTML=`${head("02",`${st.name}'s first try`)}
    <div class="chat">
      <div class="me"><span class="tag">${esc(st.name)} asks</span>${esc(st.firstPrompt)}<br><span class="att">📎 ${esc(st.attach)}</span></div>
      <div class="ai"><span class="tag">AI</span>${m.html}</div>
    </div>
    <div class="box"><p class="label" style="margin-bottom:10px">What's wrong with it</p>${wrongList(m.order)}</div>
    <p class="lede">${esc(st.firstWhy)}</p>
    ${nextBtn(cur,"Fix the request →")}`;
  wireNext(sec);
}
function ch3(sec,cur){ const st=S.st;
  sec.innerHTML=`${head("03",`Try again, with what ${st.name} knows`)}
    <p class="lede">${esc(st.name)} doesn't need a smarter AI. ${st.He} needs to tell it what ${st.he} already knows. Tick each fact to add it to the request, and watch the answer change.</p>
    <div class="opts">${st.options.map(o=>`<label class="opt ${S.f[o.k]?"on":""}" data-k="${o.k}"><input type="checkbox" ${S.f[o.k]?"checked":""}><div><b>${esc(o.t)}</b><span>${esc(o.s)}</span></div></label>`).join("")}</div>
    <div class="meter" id="meter"></div>
    <div class="panes">
      <div><p class="label" style="margin-bottom:8px">${esc(st.name)}'s request</p><div class="req" id="req"></div></div>
      <div><p class="label" style="margin-bottom:8px">AI's answer</p><div class="ai" id="ans" style="max-width:none"></div></div>
    </div>
    <div class="box" id="left"></div>
    ${nextBtn(cur,"Check it before sending →")}`;
  sec.querySelectorAll(".opt").forEach(l=>l.querySelector("input").onchange=e=>{ S.f[l.dataset.k]=e.target.checked; l.classList.toggle("on",e.target.checked); paint3(true); });
  paint3(false); wireNext(sec);
}
function paint3(flash){ const st=S.st;
  const r=st.compose(S.f), m=markup(r.text,r.problems), added=st.options.filter(o=>S.f[o.k]), n=r.problems.length;
  $("#req").innerHTML=esc(st.basePrompt)+added.map(o=>`\n\n<span class="add">${esc(o.line)}</span>`).join("");
  const a=$("#ans"); a.innerHTML=m.html; if(flash){ a.classList.remove("flash"); void a.offsetWidth; a.classList.add("flash"); }
  $("#meter").innerHTML=`<span class="pill ${n?"bad":"good"}">${n?`${n} problem${n>1?"s":""} left`:"No problems left"}</span><span class="pill">${words(r.text)} words</span><span class="pill">${added.length} of ${st.options.length} facts added</span>`;
  $("#left").innerHTML = n ? `<p class="label" style="margin-bottom:10px">Still wrong</p>${wrongList(m.order)}`
                           : `<p><b>That's an answer ${esc(st.name)} can actually use.</b> Nothing in it is made up, and it sounds like ${st.him}.</p>`;
}
function ch4(sec,cur){ const st=S.st;
  const cl=st.claims(S.f), bad=cl.filter(c=>!c.ok).length;
  sec.innerHTML=`${head("04","Check it before sending")}
    <p class="lede">Even a good answer gets one last look. For each fact in it: where did it come from?</p>
    <ul class="claims">${cl.map(c=>`<li class="${c.ok?"ok":"no"}"><span class="ic">${c.ok?"✓":"!"}</span><span><q>${esc(c.q)}</q><br><span class="small muted">${esc(c.s)}</span></span></li>`).join("")}</ul>
    <div class="verdict ${bad?"":"ok"}">${bad?`<b>${bad} thing${bad>1?"s":""} in this answer ${bad>1?"aren't":"isn't"} backed by anything ${esc(st.name)} knows.</b> Go back and add the missing facts, or send it anyway and see what happens.`:`<b>Every fact traces back to something ${esc(st.name)} actually knows.</b> Safe to send.`}</div>
    ${cur?`<div class="end"><button class="next">Send it →</button>${bad?`<button class="btn2" id="fixit">Go back and fix it</button>`:""}</div>`:""}`;
  wireNext(sec);
  const fx=sec.querySelector("#fixit"); if(fx) fx.onclick=()=>{ renderUpTo(3); $("#ch3").scrollIntoView({behavior:"smooth",block:"start"}); };
}
function ch5(sec,cur){ const st=S.st;
  const r=st.compose(S.f), n=r.problems.length;
  sec.innerHTML=`${head("05",st.postedTitle)}${st.posted(r,n)}
    ${n?`<p class="lede">That answer is out now, mistakes included. The fix was never the AI. It was the facts ${esc(st.name)} left out.</p>`:""}
    ${nextBtn(cur,"Your turn →")}`;
  wireNext(sec);
}
function ch6(sec){ const st=S.st;
  sec.innerHTML=`${head("06","Your turn")}
    <p class="lede">${esc(st.turnIntro)}</p>
    ${st.turnPrimary()}
    <div><p class="label" style="margin-bottom:8px">What ${esc(st.name)} knows</p>${st.turnKnows()}</div>
    <div><label class="label" for="mine" style="display:block;margin-bottom:8px">Your request to the AI</label>
      <textarea id="mine" placeholder="${esc(st.placeholder)}"></textarea></div>
    <div class="end"><button class="next" id="ask">Ask the AI</button><span class="small muted">No checklist this time. Use what you saw above.</span></div>
    <div id="out" style="display:flex;flex-direction:column;gap:16px"></div>`;
  $("#ask").onclick=()=>{
    const t=$("#mine").value.trim(); if(t.length<10){ $("#mine").focus(); return; }
    const f=Object.fromEntries(Object.entries(st.detect).map(([k,re])=>[k,re.test(t)]));
    const r=st.turnCompose(f), m=markup(r.text,r.problems), hit=Object.values(f).filter(Boolean).length;
    $("#out").innerHTML=`
      <div class="chat"><div class="me"><span class="tag">You ask</span>${esc(t)}<br><span class="att">📎 ${esc(st.turnAttach)}</span></div>
        <div class="ai"><span class="tag">AI</span>${m.html}</div></div>
      <div class="box"><p class="label" style="margin-bottom:10px">Your request covered ${hit} of ${st.options.length}</p>
        <ul class="covered">${st.options.map(o=>`<li><span class="${f[o.k]?"y":"n"}">${f[o.k]?"✓":"○"}</span><span>${esc(o.t)}${f[o.k]?"":` <span class="muted small">· e.g. “${esc(st.hints[o.k])}”</span>`}</span></li>`).join("")}</ul></div>
      ${r.problems.length?`<div class="box"><p class="label" style="margin-bottom:10px">What went wrong because something was missing</p>${wrongList(m.order)}</div><div class="end"><button class="btn2" id="again">Edit my request and ask again</button></div>`
        :`<div class="verdict ok"><b>Nothing made up, nothing missing.</b> You wrote that request without a checklist. That's the skill.</div>`}
      <div class="take"><h3>${esc(st.take.h)}</h3><ol>${st.take.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
      <div class="end"><button class="next" id="other">Now help ${st.id==="tom"?"Maria":"Tom"} →</button><button class="link" id="home2">Back to both stories</button></div>`;
    if($("#again")) $("#again").onclick=()=>{ $("#mine").focus(); $("#mine").scrollIntoView({behavior:"smooth",block:"center"}); };
    $("#other").onclick=()=>story(st.id==="tom"?"maria":"tom");
    $("#home2").onclick=home;
    $("#out").scrollIntoView({behavior:"smooth",block:"start"});
  };
}

home();
</script>

</body>
</html>
